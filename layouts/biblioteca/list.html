{{ define "main" }}

<section class="flow">

    <h1>{{ .Title }}</h1>

    {{ with .Content }}
        {{ . }}
    {{ end }}

    {{ if .Pages }}
        <ul class="elenco-articoli">
            {{ range .Pages }}
                <li>
                    <a href="{{ .RelPermalink }}">
                        {{ .Title }}
                    </a>
                </li>
            {{ end }}
        </ul>
    {{ end }}

</section>

{{ end }}
