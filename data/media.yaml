# data/media.yaml — catalogo dei media (file/distribuzione)
#
# Fonte normativa: MEDIA-SPEC.md.
# Decisione tecnica: DECISIONS/DR-07-media-infrastructure-proposal.md
# (Approvata, Alternativa A: solo lookup dati, nessuna taxonomy Hugo).
# Collegato da: DECISIONS/DR-02 (Dataset.media_id referenzia l'id di una
# voce qui) e DECISIONS/DR-05 (Dataset eredita `visibility` da qui,
# tramite media_id, mai duplicata sul Dataset).
#
# Questo file è un contenitore. Non contiene alcun media reale.
#
# Schema per ogni voce:
#
# Obbligatori:
#   id:          identificativo stabile (MEDIA-SPEC §24-25, indipendente
#                dal percorso fisico del file)
#   type:        es. immagine, fotografia, diagramma, pdf, epub, audio,
#                video, dataset, altro (MEDIA-SPEC §1, lista non chiusa)
#   visibility:  obbligatorio senza condizioni (MEDIA-SPEC §3: "ogni
#                media deve avere uno stato di distribuzione") — uno tra:
#                public | private | controlled | pending_review
#                (valori esatti e soli ammessi, MEDIA-SPEC §3)
#
# Opzionali (MEDIA-SPEC §17 — "non tutti i campi sono obbligatori per
# ogni tipo di media"):
#   title:            titolo descrittivo
#   creator:          autore o creatore (§17)
#   date:             data del media
#   language:         lingua, quando pertinente
#   provenance:       provenienza
#   license:          licenza (mai inventata dall'agente, §12)
#   doi:               identificativo esterno, quando esiste
#   url:              URL originale
#   checksum:         per verifica integrità (§7, mutuato da DATASET-SPEC)
#   size:             dimensione del file
#   format:           formato tecnico
#   storage_location: posizione nello storage (il catalogo resta
#                     concettualmente separato dal file, §25)
#   source_id:        riferimento opzionale a data/sources.yaml (§5,
#                     "fonte e media" — la fonte e il file non sono la
#                     stessa entità)
#   topics:           riferimento opzionale a data/topics.yaml (§18,
#                     "quando applicabile")
#   notes:            note editoriali
#
# Permessi — asse SEPARATO dalla visibilità (MEDIA-SPEC §4), booleani,
# opzionali ("quando necessario"). Se assenti, NON vanno dedotti in
# senso favorevole dalla sola `visibility: public` (MEDIA-SPEC §2/§4):
#   can_read:          bool
#   can_research:      bool
#   can_cite:          bool
#   can_publish:       bool
#   can_redistribute:  bool
#
# Esempio di struttura (commentato, NON un media reale):
#   - id: esempio-placeholder
#     type: pdf
#     visibility: private
#     title: "Esempio (placeholder)"
#     source_id: esempio2024
#     can_read: true
#     can_research: true
#     can_cite: true
#     can_publish: false
#     can_redistribute: false
#
# Voce di fixture tecnica (DECISIONS/DR-08-content-fixture-system-proposal.md).
# Non un file reale: nessun `storage_location`/`url` verso un file fisico,
# coerente con lo schema (catalogo separato dal file, §25) e con la lezione
# di MEMORY/MEM-2026-08-16-01 (mai allegare un file reale a un dato di
# fixture). Collegata a `fixture-fonte` tramite `source_id`: questo è oggi
# l'unico modo approvato per legare Media a un Article, indirettamente
# tramite Source — vedi PHASE-2-PLAN.md, domanda aperta #17.

- id: fixture-media
  type: pdf
  visibility: private
  title: "Media di Fixture (dato tecnico, non un file reale)"
  source_id: fixture-fonte
  can_read: true
  can_research: true
  can_cite: true
  can_publish: false
  can_redistribute: false

# Primo media audio reale del progetto (handoff-audio-pratica-2026-09-07.md).
# Eccezione dichiarata e temporanea a MEDIA-SPEC §6/§26 ("Git non deve
# essere utilizzato come biblioteca generale di... audio"), decisa dal
# proprietario 2026-09-07: il file resta in static/ (quindi in git) finché
# il sito non ha un dominio proprio; verrà poi migrato a Cloudflare R2
# (proposta verificata sui prezzi ufficiali, confermata dal proprietario) e
# questa nota andrà aggiornata di conseguenza. `creator` non riporta il nome
# reale del proprietario: coerente con la decisione già presa sull'identità
# editoriale del sito (voce anonima "StamoTenti", vedi data/authors.yaml e
# content/il-progetto/_index.md, mai il nome reale in contenuto pubblico) —
# questo file dati è parte del repository Git pubblico del progetto, quindi
# soggetto alla stessa regola, anche se l'handoff originale suggeriva
# `creator = il proprietario` in modo letterale.
- id: dalla-tradizione-al-secolare-pratica
  type: audio
  visibility: public
  title: "Pratica breve — Dalla tradizione al secolare"
  creator: "StamoTenti"
  storage_location: "static/audio/dalla-tradizione-al-secolare-pratica.mp3"
  url: "/audio/dalla-tradizione-al-secolare-pratica.mp3"
  format: "audio/mpeg"
  notes: "Temporaneo in static/ (quindi versionato in git), in attesa di migrazione a Cloudflare R2 al lancio del sito (dominio non ancora acquistato) — vedi stamotenti-editorial/handoff-audio-pratica-2026-09-07.md. Voce reale del proprietario, non una lettura di un testo da verificare parola per parola: nessun controllo di corrispondenza testo/audio necessario (chiarito esplicitamente dal proprietario, handoff-revisione-articolo1-2026-09-07.md §6d)."
  can_read: true
  can_research: true
  can_cite: true
  can_publish: true
  can_redistribute: false
