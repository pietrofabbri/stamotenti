name: Zenodo edit metadata (backlink or title)

# Handoff "backlink-zenodo-spaziatura-pagine", 2026-10-29, Parte A.
# Esteso con la modalita' set-title, handoff "zenodo-titolo-articolo1-en",
# 2026-10-31.
#
# Modifica i metadati di un record Zenodo GIA' pubblicato, senza crearne
# una nuova versione e senza toccare DOI/file (scripts/zenodo_deposit.py,
# funzioni add_related_identifier e set_title -- vedi i loro docstring
# per il dettaglio dell'azione "edit" + publish usata). Due modalita':
#
# - add-backlink: aggiunge un related_identifier (es. il collegamento
#   all'indietro isOriginalFormof quando un record IT e' stato pubblicato
#   prima del suo gemello EN).
# - set-title: cambia solo il campo title (es. per togliere un carattere
#   vietato introdotto prima che la regola esistesse).
#
# Solo workflow_dispatch, MAI sul push: a differenza di un nuovo deposito
# (irreversibile ma "additivo", un nuovo DOI), questa modifica tocca un
# record gia' esistente -- va lanciata esplicitamente da chi ha
# verificato i parametri, non scattare come effetto collaterale di un
# push qualunque.
#
# Non genera PDF, non builda il sito: lo script in queste modalita' fa
# solo chiamate all'API Zenodo sui metadati di un record esistente,
# nessuna dipendenza da Hugo/Playwright.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Cosa modificare"
        required: true
        type: choice
        options:
          - add-backlink
          - set-title
        default: add-backlink
      record_id:
        description: "ID del record/deposition Zenodo da modificare (es. 23783072)"
        required: true
        type: string
      identifier:
        description: "[add-backlink] DOI da aggiungere come related_identifier (es. 10.5281/zenodo.23783075)"
        required: false
        type: string
      relation:
        description: "[add-backlink] Relazione DataCite/Zenodo (grafia esatta)"
        required: false
        type: string
        default: "isOriginalFormof"
      title:
        description: "[set-title] Nuovo title esatto"
        required: false
        type: string
      sandbox:
        description: "true = sandbox.zenodo.org, false = produzione (zenodo.org)"
        required: true
        type: boolean
        default: false
      dry_run:
        description: "true = non scrive nulla, mostra solo cosa farebbe (via API pubblica, nessun token richiesto)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  edit-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # ruamel.yaml serve solo perché zenodo_deposit.py lo importa a
        # livello di modulo (per load_deposits/save_deposits, non usate
        # da --add-backlink/--set-title) -- comunque richiesto perché
        # l'import gira prima che argparse scelga la modalità.
        run: pip install requests ruamel.yaml

      - name: Add related identifier
        if: inputs.mode == 'add-backlink'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: |
          python3 scripts/zenodo_deposit.py --add-backlink \
            --record-id "${{ inputs.record_id }}" \
            --identifier "${{ inputs.identifier }}" \
            --relation "${{ inputs.relation }}" \
            ${{ inputs.sandbox == 'true' && '--sandbox' || '' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Set title
        if: inputs.mode == 'set-title'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: |
          python3 scripts/zenodo_deposit.py --set-title \
            --record-id "${{ inputs.record_id }}" \
            --title "${{ inputs.title }}" \
            ${{ inputs.sandbox == 'true' && '--sandbox' || '' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
